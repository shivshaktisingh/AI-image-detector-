<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Detection Result</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background: #fff;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0px 5px 25px rgba(0,0,0,0.3);
      width: 450px;
      text-align: center;
    }
    h1 {
      margin-bottom: 20px;
      color: #222;
    }
    .result {
      font-size: 20px;
      font-weight: bold;
      color: #444;
      margin: 15px 0;
    }
    img {
      margin-top: 15px;
      max-width: 100%;
      border-radius: 10px;
      box-shadow: 0px 4px 12px rgba(0,0,0,0.2);
    }
    a {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      background: #0072ff;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      transition: 0.3s;
    }
    a:hover {
      background: #005bd1;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Detection Result</h1>
    <div class="result">{{ result }}</div>
    <img src="{{ img_path }}" alt="Uploaded Image">
    <br>
    <a href="/">⬅ Upload Another</a>
  </div>
</body>
</html>
